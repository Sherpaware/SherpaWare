# Signed build uploaded to TestFlight. Run by hand from the Actions tab. UNTESTED until the Apple secrets exist.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID        10-character Team ID (developer.apple.com > Membership details)
#   ASC_ISSUER_ID        App Store Connect > Users and Access > Integrations > App Store Connect API: Issuer ID
#   ASC_KEY_ID           the Key ID of the API key
#   ASC_KEY_P8           the full text of the downloaded AuthKey_XXXX.p8 file
# Also needs an app record in App Store Connect with bundle id com.sherpaware.n282bt.
name: ios-testflight
on: { workflow_dispatch: {} }
jobs:
  testflight:
    if: github.repository == 'Sherpaware/SherpaWare'
    runs-on: macos-latest
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check secrets are present
        run: |
          for v in TEAM_ID ISSUER KEY_ID KEY_P8; do if [ -z "${!v}" ]; then echo "missing secret for $v"; exit 1; fi; done
      - name: Write the API key to disk (never printed)
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$KEY_P8" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
      - name: Install Capacitor and add the iOS project
        working-directory: native
        run: |
          npm install
          python3 scripts/prepare_web.py
          npx cap add ios
          python3 scripts/patch_ios.py
          npx cap sync ios
      - name: Create a short-lived distribution certificate and profile (API)
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography || pip3 install --quiet pyjwt cryptography
          python3 native/scripts/asc_signing.py create "$RUNNER_TEMP/sign"
      - name: Install signing files
        run: |
          S="$RUNNER_TEMP/sign"; KC="$RUNNER_TEMP/ci.keychain-db"; PW=$(openssl rand -hex 16)
          openssl x509 -inform DER -in "$S/dist.cer" -out "$S/dist.pem"
          openssl pkcs12 -export -legacy -inkey "$S/dist.key" -in "$S/dist.pem" -out "$S/dist.p12" -passout pass:"$PW" 2>/dev/null || \
            openssl pkcs12 -export -inkey "$S/dist.key" -in "$S/dist.pem" -out "$S/dist.p12" -passout pass:"$PW"
          security create-keychain -p "$PW" "$KC"; security set-keychain-settings -lut 3600 "$KC"; security unlock-keychain -p "$PW" "$KC"
          security import "$S/dist.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          UUID=$(python3 -c "import json;print(json.load(open('$S/ids.json'))['uuid'])")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$S/dist.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          # Use the team the profile actually belongs to (the APPLE_TEAM_ID secret may not match).
          security cms -D -i "$S/dist.mobileprovision" > "$S/profile.plist"
          SIGN_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$S/profile.plist")
          if [ "$SIGN_TEAM" = "$TEAM_ID" ]; then echo "team from profile matches APPLE_TEAM_ID secret"; else echo "NOTE: team from profile ($SIGN_TEAM) differs from the APPLE_TEAM_ID secret; using the profile's team"; fi
          echo "SIGN_TEAM=$SIGN_TEAM" >> "$GITHUB_ENV"; export SIGN_TEAM
          # Sign the App target only (not the Capacitor plugin packages).
          python3 - "$UUID" <<'PY'
          import re, sys, os
          uuid, team = sys.argv[1], os.environ['SIGN_TEAM']
          p = 'native/ios/App/App.xcodeproj/project.pbxproj'; s = open(p).read(); n = 0
          def fix(m):
              global n
              b = m.group(0)
              if 'PRODUCT_BUNDLE_IDENTIFIER' not in b: return b
              n += 1
              b = re.sub(r'\s*(CODE_SIGN_STYLE|CODE_SIGN_IDENTITY(\[[^\]]*\])?|"CODE_SIGN_IDENTITY\[[^\]]*\]"|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE) = [^;]*;', '', b)
              return b.replace('buildSettings = {', 'buildSettings = {\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n\t\t\t\tDEVELOPMENT_TEAM = %s;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "%s";' % (team, uuid), 1)
          s = re.sub(r'buildSettings = \{.*?\n\t\t\t\};', fix, s, flags=re.S)
          open(p, 'w').write(s); print('signing set on', n, 'App build configurations')
          if not n: sys.exit('App target build settings not found')
          PY
      - name: Archive (signed)
        working-directory: native/ios/App
        run: |
          set -o pipefail
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" MARKETING_VERSION=0.1.0 archive | tail -60
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$SIGN_TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.sherpaware.n282bt</key><string>$PROFILE_UUID</string></dict>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" | tail -60
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1); echo "exported $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER" --output-format normal
      - name: Revoke the CI certificate
        if: always()
        run: python3 native/scripts/asc_signing.py cleanup "$RUNNER_TEMP/sign" || true
      - name: Remove the key
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
